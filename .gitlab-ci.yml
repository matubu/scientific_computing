image: sirehna/dind

services:
    - docker:dind

before_script:
  - git submodule sync --recursive
  - git submodule update --init --recursive

stages:
  - lint
  - build

lint:
   stage: lint
   script:
     - make lint

Windows 64 bits with GCC POSIX threads:
   stage: build
   script:
     - make windows_posixthreads
     - mv ssc/build_win/ssc.zip .
   artifacts:
     paths:
     - ssc.zip

Windows 64 bits with GCC 5.4.0 win32 threads:
   stage: build
   script:
     - make windows_win32threads
     - mv ssc/build_win32threads/ssc.zip .
   artifacts:
     paths:
     - ssc.zip

Debian 10 with GCC 8:
   stage: build
   script:
     - make debian_10_release_gcc_8
     - mv ssc/build_deb10/ssc.deb .
   artifacts:
     paths:
     - ssc.deb

Debian 9 with GCC 6:
   stage: build
   script:
     - make debian_9_release_gcc_6
     - mv ssc/build_deb9/ssc.deb .
   artifacts:
     paths:
     - ssc.deb

